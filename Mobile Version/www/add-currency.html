    // Populate currency dropdown
    const currencySelect = document.getElementById("currencySelect");
    worldCurrencies.forEach(item => {

        `${item.country} - ${item.name} (${item.code})`,
        JSON.stringify(item)

    });

    // ── PayPal Smart Buttons ───────────────────────────────────────
    if (window.paypal) {
      paypal.Buttons({
        style: { layout: 'vertical', color: 'gold', shape: 'rect', label: 'paypal' },

        createOrder(data, actions) {
          if (!currencySelect.value) {
            alert("Please select a currency before paying.");
            return Promise.reject(new Error("No currency selected"));
          }
          const selected = JSON.parse(currencySelect.value);
          return actions.order.create({
            purchase_units: [{
              amount: { value: '0.99', currency_code: 'GBP' },
              description: `Add Custom Currency: ${selected.code} - ${selected.name}`
            }]
          });
        },

        onApprove(data, actions) {
          return actions.order.capture().then(async (details) => {
            const selected = JSON.parse(currencySelect.value);
            const userId   = getCognitoUserId();

            // Record purchase in DynamoDB via API Gateway
            try {
              await fetch('https://teiit1vla3.execute-api.eu-west-2.amazonaws.com/prod/purchases', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  userId,
                  currencyCode: selected.code,
                  currencyName: selected.name,
                  country:      selected.country
                })
              });
            } catch (err) {
              console.error("Failed to log purchase:", err);
            }

            // Save to localStorage and redirect
            const saved = JSON.parse(localStorage.getItem("customCurrencies")) || {};
            saved[selected.code] = `${selected.country} (${selected.name})`;
            localStorage.setItem("customCurrencies", JSON.stringify(saved));
            localStorage.setItem("fromCurrency", selected.code);
            window.location.href = "index.html";
          });
        },

        onError(err) {
          console.error("PayPal Error:", err);
          alert("Payment error. Please try again.");
        }
      }).render('#paypal-button-container');
