<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Holiday Currency Converter</title>

  <!-- ── Auth gate: run before ANY page content renders ──────────────
       If the user is not signed in, go straight to the sign-in page.
       Signed-in users continue to the converter below. -->
  <script>
    (function () {
      var signedIn = false;
      for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i);
        if (key && key.indexOf('CognitoIdentityServiceProvider.') === 0 && key.slice(-8) === '.idToken') {
          signedIn = true;
          break;
        }
      }
      if (!signedIn) {
        signedIn = !!(localStorage.getItem('cognitoAccessToken') || localStorage.getItem('cognitoIdToken'));
      }
      if (!signedIn) {
        window.location.replace('signin.html');
      }
    })();
  </script>

  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <div class="page-wrapper">
    <!-- Top nav injected by nav.js -->

    <div class="main-content">
      <div class="card">

        <div class="title-box" data-i18n="appTitle">Holiday Currency Converter</div>

        <!-- Auth warning -->
        <div id="authWarning" class="auth-warning" role="alert">
          🔒 <span data-i18n="authWarning">Please </span><a href="signin.html" data-i18n="authWarningLink">Sign In</a><span> to edit conversion values.</span>
        </div>

        <label for="amount"><b data-i18n="amountLabel">Amount to Convert:</b></label>
        <input type="number" id="amount"
               data-i18n-placeholder="amountPlaceholder"
               placeholder="Sign in to enter amount"
               inputmode="decimal" step="0.01" disabled>

        <div id="outputBox" class="output-box" aria-live="polite"
             data-i18n="outputDefault">Converted amount will appear here</div>
        <p id="note" class="note"></p>

        <label for="fromCurrency" id="fromCurrencyLabel">
          <b data-i18n="fromCurrencyLabel">From Currency:</b>
        </label>
        <select id="fromCurrency" aria-label="From currency"></select>

        <label for="toCurrency">
          <b data-i18n="toCurrencyLabel">To Currency:</b>
        </label>
        <select id="toCurrency" aria-label="To currency"></select>

        <button id="swapButton" class="btn-ghost" onclick="swapCurrencies()"
                data-i18n="swapBtn">🔄 Swap Currencies</button>
        <button id="fetchRateBtn" class="btn-primary" onclick="fetchLiveExchangeRate()"
                data-i18n="fetchBtn">⚡ Fetch Live Exchange Rate</button>

        <div class="manual-rate">
          <h3 data-i18n="manualRateTitle">Exchange rate currency bought at:</h3>
          <div class="rate-row">
            <label id="forwardLabel" data-i18n="forwardLabel">From → To:</label>
            <input type="number" id="manualRateForward"
                   data-i18n-placeholder="ratePlaceholder"
                   placeholder="Sign in to enter rate"
                   inputmode="decimal" step="0.0001" disabled>
          </div>
          <div class="rate-row" id="inverseContainer" style="display:none;">
            <label id="inverseLabel" data-i18n="inverseLabel">To → From:</label>
            <input type="number" id="manualRateInverse" placeholder="e.g. 0.80"
                   inputmode="decimal" step="0.0001" disabled>
          </div>
          <button id="saveButton" class="btn-save" onclick="saveSettings()"
                  data-i18n="saveBtn">💾 Save</button>
        </div>

        <div class="add-currency-banner">
          <h3 data-i18n="addBannerTitle">Need an additional currency?</h3>
          <p data-i18n="addBannerText">Add any world currency for a one-time fee of <b>£0.99</b>.</p>
          <button class="btn-success" onclick="window.location.href='add-currency.html'"
                  data-i18n="addBannerBtn">➕ Add an Additional Currency</button>
        </div>

      </div><!-- /.card -->
    </div><!-- /.main-content -->

    <footer class="page-footer">
      <span data-i18n="footer">&copy; 2026 S Allan. All rights reserved.</span>
    </footer>
  </div><!-- /.page-wrapper -->

  <script>
    // ── Currency data ──────────────────────────────────────────────
    const currencies = {
      GBP: "British Pound",
      EUR: "Euro",
      USD: "US Dollar",
      AUD: "Australian Dollar",
      CAD: "Canadian Dollar",
      CNY: "Chinese Yuan",
      JPY: "Japanese Yen",
      NZD: "New Zealand Dollar"
    };

    // ── DOM refs ───────────────────────────────────────────────────
    const fromSelect        = document.getElementById("fromCurrency");
    const toSelect          = document.getElementById("toCurrency");
    const outputBox         = document.getElementById("outputBox");
    const noteEl            = document.getElementById("note");
    const manualRateForward = document.getElementById("manualRateForward");
    const manualRateInverse = document.getElementById("manualRateInverse");
    const amountInput       = document.getElementById("amount");
    const forwardLabel      = document.getElementById("forwardLabel");
    const inverseLabel      = document.getElementById("inverseLabel");
    const authWarning       = document.getElementById("authWarning");
    const fetchRateBtn      = document.getElementById("fetchRateBtn");

    // ── (Auth gate runs in <head> before render — see top of file) ──

    // ── Auth ───────────────────────────────────────────────────────
    function isCognitoSignedIn() {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith("CognitoIdentityServiceProvider.") && key.endsWith(".idToken")) {
          return true;
        }
      }
      return !!(localStorage.getItem("cognitoAccessToken") || localStorage.getItem("cognitoIdToken"));
    }

    function applyAuthProtection() {
      const auth = isCognitoSignedIn();
      amountInput.disabled          = !auth;
      manualRateForward.disabled    = !auth;
      fetchRateBtn.disabled         = !auth;
      amountInput.placeholder       = auth ? t('amountActivePlaceholder') : t('amountPlaceholder');
      manualRateForward.placeholder = auth ? t('rateActivePlaceholder')   : t('ratePlaceholder');
      authWarning.style.display     = auth ? "none" : "block";
    }

    // ── Dropdowns ──────────────────────────────────────────────────
    function populateSelects() {
      // One-time default migration: force USD → GBP for installs
      // that predate the new defaults. Runs once per install.
      if (!localStorage.getItem("defaultsV2Applied")) {
        localStorage.setItem("fromCurrency", "USD");
        localStorage.setItem("toCurrency",   "GBP");
        localStorage.setItem("defaultsV2Applied", "true");
      }

      fromSelect.innerHTML = "";
      toSelect.innerHTML   = "";

      const saved = JSON.parse(localStorage.getItem("customCurrencies")) || {};
      const all   = { ...currencies, ...saved };

      for (const [code, name] of Object.entries(all)) {
        fromSelect.add(new Option(`${code} - ${name}`, code));
        toSelect.add(new Option(`${code} - ${name}`, code));
      }

      const codes        = Object.keys(all);
      const savedFrom    = localStorage.getItem("fromCurrency") || "USD";
      const savedTo      = localStorage.getItem("toCurrency")   || "GBP";
      const resolvedFrom = codes.includes(savedFrom) ? savedFrom : codes[0];
      const resolvedTo   = codes.includes(savedTo) && savedTo !== resolvedFrom
                           ? savedTo
                           : codes.find(c => c !== resolvedFrom) || codes[0];

      fromSelect.value = resolvedFrom;
      toSelect.value   = resolvedTo;

      localStorage.setItem("fromCurrency", resolvedFrom);
      localStorage.setItem("toCurrency",   resolvedTo);

      updateRateLabels();
      loadSavedRate();
    }

    function currencyKey() {
      return `${fromSelect.value}_${toSelect.value}`;
    }

    function loadSavedRate() {
      const rates = JSON.parse(localStorage.getItem("savedRates")) || {};
      const key   = currencyKey();
      if (rates[key]) {
        manualRateForward.value = parseFloat(rates[key]).toFixed(4);
        manualRateInverse.value = (1 / rates[key]).toFixed(4);
      } else {
        manualRateForward.value = "";
        manualRateInverse.value = "";
      }
    }

    function updateRateLabels() {
      forwardLabel.textContent = `${t('forwardLabel').replace('From', fromSelect.value).replace('To', toSelect.value)}`;
      inverseLabel.textContent = `${t('inverseLabel').replace('To', toSelect.value).replace('From', fromSelect.value)}`;
      // Simple approach: show currency codes in labels
      forwardLabel.textContent = `From (${fromSelect.value}) → To (${toSelect.value}):`;
      inverseLabel.textContent = `To (${toSelect.value}) → From (${fromSelect.value}):`;
      loadSavedRate();
    }

    // ── Fetch live rate ────────────────────────────────────────────
    async function fetchLiveExchangeRate() {
      if (!isCognitoSignedIn()) return;

      const from = fromSelect.value;
      const to   = toSelect.value;

      if (!from || !to) {
        outputBox.textContent = t('selectBothMsg');
        return;
      }
      if (from === to) {
        outputBox.textContent = t('selectDiffMsg');
        return;
      }

      fetchRateBtn.disabled    = true;
      fetchRateBtn.textContent = t('fetchingBtn');

      try {
        let rate = null;

        let resp = await fetch(`https://open.er-api.com/v6/latest/${from}`);
        let data = await resp.json();

        if (data?.result === "success" && data.rates?.[to] !== undefined) {
          rate = data.rates[to];
        } else {
          resp = await fetch(`https://open.er-api.com/v6/latest/${to}`);
          data = await resp.json();
          if (data?.result === "success" && data.rates?.[from] !== undefined) {
            rate = 1 / data.rates[from];
          }
        }

        if (rate !== null && rate > 0) {
          const decimals = rate < 0.01 ? 6 : rate < 0.1 ? 5 : 4;
          manualRateForward.value = rate.toFixed(decimals);
          manualRateInverse.value = (1 / rate).toFixed(4);
          convertCurrency();
          noteEl.textContent = t('liveRateFetched')
            .replace('{from}', from)
            .replace('{rate}', rate.toFixed(decimals))
            .replace('{to}', to);
        } else {
          outputBox.textContent = "—";
          noteEl.textContent    = t('rateNotAvail')
            .replace('{from}', from)
            .replace('{to}', to);
        }
      } catch (err) {
        console.error("Exchange rate error:", err);
        outputBox.textContent = "—";
        noteEl.textContent    = t('fetchFailed');
      } finally {
        fetchRateBtn.disabled    = false;
        fetchRateBtn.textContent = t('fetchBtn');
      }
    }

    // ── Convert ────────────────────────────────────────────────────
    function convertCurrency() {
      if (!isCognitoSignedIn()) return;

      const from      = fromSelect.value;
      const to        = toSelect.value;
      const amount    = parseFloat(amountInput.value);
      const rateForwd = parseFloat(manualRateForward.value);

      if (isNaN(amount) || amount <= 0)       { outputBox.textContent = "—"; noteEl.textContent = ""; return; }
      if (from === to)                         { outputBox.textContent = t('selectDiffMsg2'); noteEl.textContent = ""; return; }
      if (isNaN(rateForwd) || rateForwd <= 0) { outputBox.textContent = t('invalidRateMsg'); noteEl.textContent = ""; return; }

      const result = amount * rateForwd;
      outputBox.textContent = `${result.toFixed(2)} ${to}`;
      noteEl.textContent    = t('rateSaved')
        .replace('{from}', from)
        .replace('{rate}', rateForwd.toFixed(4))
        .replace('{to}', to);
    }

    // ── Save ───────────────────────────────────────────────────────
    function saveSettings(rate) {
      localStorage.setItem("fromCurrency", fromSelect.value);
      localStorage.setItem("toCurrency",   toSelect.value);
      if (!isCognitoSignedIn()) return;

      const rateForwd = rate ?? parseFloat(manualRateForward.value);
      if (isNaN(rateForwd) || rateForwd <= 0) return;

      const rates = JSON.parse(localStorage.getItem("savedRates")) || {};
      rates[currencyKey()] = rateForwd;
      localStorage.setItem("savedRates", JSON.stringify(rates));
    }

    // ── Swap ───────────────────────────────────────────────────────
    function swapCurrencies() {
      const tmp        = fromSelect.value;
      fromSelect.value = toSelect.value;
      toSelect.value   = tmp;

      localStorage.setItem("fromCurrency", fromSelect.value);
      localStorage.setItem("toCurrency",   toSelect.value);

      const cur = parseFloat(manualRateForward.value);
      let inverted = null;
      if (!isNaN(cur) && cur > 0) {
        inverted = 1 / cur;
        manualRateForward.value = inverted.toFixed(4);
        manualRateInverse.value = (1 / inverted).toFixed(4);
        const rates = JSON.parse(localStorage.getItem("savedRates")) || {};
        rates[currencyKey()] = inverted;
        localStorage.setItem("savedRates", JSON.stringify(rates));
      }

      updateRateLabels();
      convertCurrency();
      if (inverted && isCognitoSignedIn()) saveSettings(inverted);
    }

    // ── Event listeners ────────────────────────────────────────────
    manualRateForward.addEventListener("input", () => {
      const val = parseFloat(manualRateForward.value);
      manualRateInverse.value = (!isNaN(val) && val > 0) ? (1 / val).toFixed(4) : "";
      convertCurrency();
    });

    amountInput.addEventListener("input", convertCurrency);

    fromSelect.addEventListener("change", () => {
      localStorage.setItem("fromCurrency", fromSelect.value);
      updateRateLabels();
      convertCurrency();
    });

    toSelect.addEventListener("change", () => {
      localStorage.setItem("toCurrency", toSelect.value);
      updateRateLabels();
      convertCurrency();
    });

    // ── Init ───────────────────────────────────────────────────────
    populateSelects();
    applyAuthProtection();
    convertCurrency();
  </script>

  <script src="js/translations.js"></script>
  <script src="js/nav.js"></script>
  <script>
    initNav('Holiday Currency Converter', 'index.html');
    // Re-apply auth placeholders after translations load
    applyAuthProtection();
  </script>
</body>
</html>
