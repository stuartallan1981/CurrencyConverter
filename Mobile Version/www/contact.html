<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Contact Us - Holiday Currency Converter</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <div class="page-wrapper">
    <!-- Top nav injected by nav.js -->

    <div class="main-content">
      <div class="card">

        <div class="title-box">Contact Us</div>

        <div class="contact-intro">
          Have questions about the converter or adding custom currencies?
          Send us a message below.
        </div>

        <div id="statusMessage" class="status-msg" role="alert"></div>

        <form id="contactForm" novalidate>
          <label for="name"><b>Name:</b></label>
          <input type="text" id="name" name="name" placeholder="Your name"
                 autocomplete="name" required>

          <label for="email"><b>Email:</b></label>
          <input type="email" id="email" name="email" placeholder="Your email address"
                 inputmode="email" autocomplete="email" autocapitalize="off"
                 spellcheck="false" required>

          <label for="message"><b>Message:</b></label>
          <textarea id="message" name="message" rows="5"
                    placeholder="How can we help?" required
                    style="resize:vertical;"></textarea>

          <button type="submit" class="btn-primary">✉️ Send Message</button>
        </form>

      </div><!-- /.card -->
    </div><!-- /.main-content -->

    <footer class="page-footer">
      &copy; 2026 S Allan. All rights reserved.
    </footer>
  </div><!-- /.page-wrapper -->

  <script>
    const API_BASE = 'https://teiit1vla3.execute-api.eu-west-2.amazonaws.com/prod';

    function showStatus(message, isError = false) {
      const el = document.getElementById("statusMessage");
      el.textContent   = message;
      el.className     = "status-msg " + (isError ? "error" : "success");
      el.style.display = "block";
      el.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    document.getElementById("contactForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const submitBtn = e.target.querySelector("button[type=submit]");
      submitBtn.disabled    = true;
      submitBtn.textContent = "Sending...";

      const body = {
        name:    document.getElementById("name").value.trim(),
        email:   document.getElementById("email").value.trim(),
        message: document.getElementById("message").value.trim()
      };

      try {
        const response = await fetch(`${API_BASE}/contact`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify(body)
        });

        if (response.ok) {
          showStatus("✅ Message sent successfully! We'll be in touch soon.");
          document.getElementById("contactForm").reset();
        } else {
          showStatus("Failed to send message. Please try again.", true);
        }
      } catch (err) {
        showStatus("Error connecting to the service. Check your connection.", true);
      } finally {
        submitBtn.disabled    = false;
        submitBtn.textContent = "✉️ Send Message";
      }
    });
  </script>

  <script src="js/nav.js"></script>
  <script>initNav('Contact Us', 'contact.html');</script>
</body>
</html>
